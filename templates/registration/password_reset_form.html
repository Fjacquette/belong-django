{% extends 'base.html' %}
{% block title %}Recover account · Belong{% endblock %}
{% block content %}
<section class="mx-auto max-w-xl min-w-0 space-y-4">
  <h1 class="text-2xl font-display">Recover your account</h1>
  <p>Request a link to your email address to choose a new password.</p>
  <form method="post" class="space-y-4">{% csrf_token %}{% include 'includes/account_fields.html' %}<button type="submit" class="ui-button ui-button--primary">Send recovery link</button></form>
  <a href="{% url 'login' %}" class="ui-link">Back to sign in</a>
</section>
{% endblock %}
