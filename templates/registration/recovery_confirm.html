{% extends 'base.html' %}
{% block title %}Choose a new password · Belong{% endblock %}
{% block content %}
<section class="mx-auto max-w-xl min-w-0 space-y-4">
  <h1 class="text-2xl font-display">Choose a new password</h1>
  {% if error %}<p role="alert">{{ error }}</p><a href="{% url 'password_reset' %}" class="ui-link">Request another recovery link</a>{% else %}
  <form method="post" class="space-y-4">{% csrf_token %}{% include 'includes/account_fields.html' %}<button type="submit" class="ui-button ui-button--primary">Set new password</button></form>
  {% endif %}
</section>
{% endblock %}
