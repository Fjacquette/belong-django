<form method="post" action="{% url 'activities:reservation_action' activity.pk action %}" hx-post="{% url 'activities:reservation_action' activity.pk action %}" hx-target="#participation-{{ activity.pk }}" hx-swap="outerHTML">
  {% csrf_token %}<input type="hidden" name="variant" value="detail"><input type="hidden" name="next" value="{{ next_path }}"><input type="hidden" name="policy" value="{{ registration_target.version }}"><input type="hidden" name="pool_revision" value="{{ reservation_pool.revision }}"><input type="hidden" name="request" value="{{ registration_request.pk }}"><input type="hidden" name="hold" value="{{ reservation_hold.pk|default:'' }}"><input type="hidden" name="entry" value="{{ reservation_entry.pk|default:'' }}">
  <button class="ui-button ui-button--secondary ui-button--comfortable">{{ label }}</button>
</form>
